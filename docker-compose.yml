services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/gateway.db
      - SENTIMENT_WORKER_URL=http://model-sentiment:5000/predict
      - INTENT_WORKER_URL=http://model-intent:5000/predict
    volumes:
      - gateway-data:/data
    depends_on:
      model-sentiment:
        condition: service_healthy
      model-intent:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  model-sentiment:
    build:
      context: ./models
      dockerfile: Dockerfile
      args:
        MODEL_NAME: sentiment
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/docs\")' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  model-intent:
    build:
      context: ./models
      dockerfile: Dockerfile
      args:
        MODEL_NAME: intent
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/docs\")' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  gateway-data:
